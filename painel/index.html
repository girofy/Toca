<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel Toca</title>
<style>:root{--bg:#f6f1e8;--fg:#0b0d12;--blue:#0b57d0;--mut:#5d6472;--line:#ddd5c6;--card:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
.w{max-width:980px;margin:auto;padding:24px 18px 90px}h1{font-size:2rem;margin:0}h2{margin:36px 0 14px}.card{background:var(--card);border:1.5px solid var(--fg);border-radius:20px;padding:20px}.g{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.k b{display:block;font-size:2.4rem;line-height:1.1;color:var(--blue)}
button{background:var(--blue);color:#fff;border:0;border-radius:99px;padding:18px 26px;font:700 1.05rem system-ui;cursor:pointer;width:100%}button.o{background:none;color:var(--fg);border:1.5px solid var(--fg)}
input,textarea{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff}label{font-weight:600;display:block;margin:14px 0 6px}.ck{display:flex;gap:10px;align-items:center}.ck input{width:24px;height:24px}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:20px}.bars div{flex:1;text-align:center;font:600 .65rem system-ui}.bars i{display:block;background:var(--blue);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}#err,#ok{min-height:1.4em}#err{color:#b00020}#ok{color:#0a7a3b;font-weight:600}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top button{width:auto;padding:12px 20px}</style></head>
<body><div class="w" id="app"></div><script>
const $=s=>document.querySelector(s),A=$('#app'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,o={})=>{const r=await fetch('/api/'+p,{credentials:'same-origin',headers:{'content-type':'application/json'},...o});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'Erro'),{s:r.status});return j};
const NM={comprar_40:'Comprar R$ 40',comprar_100:'Comprar R$ 100',pagar:'Pagar agora (janela)',whats_modal:'WhatsApp (janela)',whats_flutuante:'WhatsApp (botão fixo)',cta_oferta:'Botões "Quero a minha"'};
async function init(){try{const s=await api('status');s.setup?auth(true,s.code):load()}catch(e){A.innerHTML='<p>'+esc(e.message)+'</p>'}}
function auth(setup,code){A.innerHTML=`<h1>Painel Toca</h1><div class="card g" style="margin-top:20px;max-width:440px"><p>${setup?'Primeiro acesso: crie a sua senha (mínimo 10 caracteres).':'Entre com a sua senha.'}</p>${setup&&code?'<input id="cd" placeholder="Código de ativação">':''}<input id="pw" type="password" autocomplete="${setup?'new-password':'current-password'}" placeholder="Senha"><button id="go">${setup?'Criar senha':'Entrar'}</button><div id="err"></div></div>`;
const go=async()=>{try{await api(setup?'setup':'login',{method:'POST',body:JSON.stringify({password:$('#pw').value,code:$('#cd')?.value})});load()}catch(e){$('#err').textContent=e.message}};$('#go').onclick=go;$('#pw').onkeydown=e=>e.key=='Enter'&&go()}
const list=(a,f=x=>x)=>a.length?a.map(r=>`<div class="row"><span>${esc(f(r.l))}</span><b>${r.n}</b></div>`).join(''):'<p style="color:var(--mut)">Sem dados ainda.</p>';
async function load(){let st,cf;try{[st,cf]=await Promise.all([api('stats'),api('config')])}catch(e){return e.s==401?auth(false):A.innerHTML='<p>'+esc(e.message)+'</p>'}
const mx=Math.max(1,...st.days.map(d=>d.n)),F=[['h1a','Título, linha 1','Seu cliente elogiou.'],['h1b','Título, linha 2 (itálico azul)','Mas não avaliou.'],['sub','Subtítulo'],['cta','Texto do botão principal','Quero avaliações →'],['l40','Link de pagamento, placa R$ 40'],['l100','Link de pagamento, pacote R$ 100'],['phone','WhatsApp (55 + DDD + número, só dígitos)','5574981017188'],['waMsg','Mensagem pronta do WhatsApp'],['scText','Texto da escassez (use {n} para o número)','Restam {n} placas']];
const cl=st.clicks.reduce((a,r)=>a+r.n,0);
A.innerHTML=`<div class="top"><h1>Painel Toca</h1><button class="o" id="lo">Sair</button></div>
<h2>Visitas</h2><div class="g k"><div class="card"><b>${st.today}</b>hoje</div><div class="card"><b>${st.week}</b>últimos 7 dias</div><div class="card"><b>${st.month}</b>últimos 30 dias</div><div class="card"><b>${cl}</b>cliques (30 dias)</div></div>
<div class="card" style="margin-top:14px"><b>Últimos 14 dias</b><div class="bars">${st.days.map(d=>`<div title="${d.n}">${d.n}<i style="height:${d.n/mx*100}px"></i>${d.d.slice(0,2)}</div>`).join('')}</div></div>
<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:14px"><div class="card"><b>Cliques por botão</b>${list(st.clicks,l=>NM[l]||l)}</div><div class="card"><b>Cidades</b>${list(st.cities)}</div><div class="card"><b>Aparelhos</b>${list(st.devices,l=>l=='m'?'Celular':'Computador')}</div></div>
<h2>Editar o site</h2><div class="card">${F.map(([k,t,ph])=>`<label for="f_${k}">${t}</label>${k=='sub'||k=='waMsg'?`<textarea id="f_${k}" rows="3" placeholder="${esc(ph||'Deixe vazio para usar o texto padrão')}">${esc(cf[k])}</textarea>`:`<input id="f_${k}" placeholder="${esc(ph||'Deixe vazio para usar o padrão')}" value="${esc(cf[k])}">`}`).join('')}
<label class="ck"><input type="checkbox" id="f_scOn" ${cf.scOn?'checked':''}> Mostrar aviso de escassez no site</label>
<label for="f_scLeft">Placas disponíveis (use o número real)</label><input id="f_scLeft" type="number" min="0" value="${cf.scLeft??''}">
<label for="f_ends">Escassez expira em (opcional)</label><input id="f_ends" type="datetime-local" value="${esc(cf.ends)}">
<p style="color:var(--mut)">Campos vazios voltam ao texto padrão do site.</p><button id="sv">SALVAR ALTERAÇÕES</button><div id="ok"></div><div id="err"></div></div>`;
$('#lo').onclick=async()=>{await api('logout');auth(false)};
$('#sv').onclick=async()=>{const b={scOn:$('#f_scOn').checked,scLeft:$('#f_scLeft').value,ends:$('#f_ends').value};F.forEach(([k])=>b[k]=$('#f_'+k).value);$('#ok').textContent='';$('#err').textContent='';try{await api('config',{method:'PUT',body:JSON.stringify(b)});$('#ok').textContent='Salvo. O site já está com as mudanças.'}catch(e){$('#err').textContent=e.message}}}
init();
</script></body></html>
